# gitleaks configuration
# https://github.com/gitleaks/gitleaks#configuration

title = "dIKta.me gitleaks config"

[extend]
# Use the default ruleset
useDefault = true

[allowlist]
description = "Global allowlist — synthetic keys in test fixtures and documentation"
paths = [
  '''website/QUICKSTART\.md''',
  '''plans/ACCOUNTS_SIGNIN\.md''',
  '''src/DiktaMe\.App/Themes/SharedResources\.xaml''',
  '''src/DiktaMe\.App/Themes/Palettes/.*\.xaml''',
  '''src/DiktaMe\.App/App\.xaml''',
]
regexTarget = "secret"
regexes = [
  '''AIzaSyABCDEFGHIJKLMNOPQRSTUVWXYZ0123456''',
]
